  "index",
  "rel_strike",
  "tte",
  "fut_mid_price",
  "call_bid_price",
  "call_ask_price",
  "call_bid_amount",
  "call_ask_amount",
  "put_bid_price",
  "put_ask_price",
  "put_bid_amount",
  "put_ask_amount",
  "fut_bid_price",
  "fut_ask_price",
  "fut_bid_amount",
  "fut_ask_amount",
  "spot_bid_price",
  "spot_ask_price",
  "spot_bid_amount",
  "spot_ask_amount",
  "call_open_interest",
  "put_open_interest",
  "call_ask_price_xS",
  "call_bid_price_xS",
  "put_ask_price_xS",
  "put_bid_price_xS",
  "cost",
  "capital_bck",
  "capital_fwd",
  "pcpb_backward",
  "pcpb_forward",
  "pcpb_bck_real",
  "pcpb_fwd_real",
  "pcpb_bck_bp",
  "pcpb_fwd_bp",
  "pcpb_bck_real_bp",
  "pcpb_fwd_real_bp",
  "pcpb_bck_ann_bp",
  "pcpb_fwd_ann_bp",
  "pcpb_bck_real_ann_bp",
  "pcpb_fwd_real_ann_bp",
  "call_opt_spread_bp",
  "put_opt_spread_bp",
  "call_opt_spread_dollar",
  "put_opt_spread_dollar",
  "call_opt_spread_capital_bp",
  "put_opt_spread_capital_bp",
  "opt_val",
  "mma_bck_bp",
  "mma_fwd_bp",
  "mma_bck_dollar",
  "mma_fwd_dollar",
  "mma_bck_capital_bp",
  "mma_fwd_capital_bp",
  "min_quote_size_dollar",
  "min_quote_size_capital",
  "contract_size",
]
sum_panel_columns = [
  "call_trade_amount",
  "call_trade_signed_amount",
  "call_trade_price_amount",
  "put_trade_amount",
  "put_trade_signed_amount",
  "put_trade_price_amount",
]
stale_panel_columns = ["call_stale", "put_stale", "spot_stale"]

[statistics]
pcpb_columns = [
  "timestamp",
  "mdy",
  "exchange",
  "ref_sym",
  "strike",
  "exp",
  "rel_strike",
  "call_opt_spread_bp",
  "put_opt_spread_bp",
  "call_opt_spread_dollar",
  "put_opt_spread_dollar",
  "call_opt_spread_capital_bp",
  "put_opt_spread_capital_bp",
  "opt_val",
  "mma_bck_dollar",
  "mma_fwd_dollar",
  "mma_bck_capital_bp",
  "mma_fwd_capital_bp",
  "tte",
  "index",
  "min_quote_size_dollar",
  "min_quote_size_capital",
  "call_stale",
  "put_stale",
  "bck_joincall_bp",
  "bck_joinput_bp",
  "fwd_joincall_bp",
  "fwd_joinput_bp",
  "mma_bck_bp",
  "mma_fwd_bp",
  # Option trades per 5-min bin, per leg (already carried in the aligned parquet).
  # trade_amount = size, trade_signed_amount = signed net flow (buy-sell),
  # trade_price_amount = size-weighted price*size (VWAP = price_amount / amount).
  "call_trade_amount",
  "call_trade_signed_amount",
  "call_trade_price_amount",
  "put_trade_amount",
  "put_trade_signed_amount",
  "put_trade_price_amount",
  # Open interest per leg (also already in the aligned parquet).
  "call_open_interest",
  "put_open_interest",
  # Exchange-reported implied vol + greeks per leg. These require re-aligning the
  # put/call/quotes/trades/chain parquets (the pairing step now carries them from
  # the options chain); before that they project as nulls.
  "call_mark_iv",
  "call_bid_iv",
  "call_ask_iv",
  "put_mark_iv",
  "put_bid_iv",
  "put_ask_iv",
  "call_delta",
  "call_gamma",
  "call_vega",
  "put_delta",
  "put_gamma",
  "put_vega",
]

[regression]
post_2024_start = "2024-01-10"
nonatm_distance = 0.05
short_tte_cutoff = 0.35

[figures]
# Lower subplot of the AMU-vs-relative-strike and AMU-vs-tte figures:
#   "frequency" -> fraction of ticks with an executable (AMU>0) path  (decomposition view)
#   "counts"    -> raw positive-tick and total-tick counts
amu_lower_panel = "frequency"

