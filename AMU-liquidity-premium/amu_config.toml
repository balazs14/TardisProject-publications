[cache]
parquet_batch_rows = 100000

[filters]
# Underlyings kept in the analysis. Other listed underlyings (SOL, XRP, ...) become
# computable once a spot/index is available (e.g. the futures-implied spot fallback),
# so restrict the post-PCP sample to BTC and ETH.
ref_syms = ["BTCUSD", "ETHUSD"]
rel_strike_min = 0.79
rel_strike_max = 1.21
spread_bp_max = 1000
min_quote_size_dollar = 5000.0
min_mma_bp = -500
max_mma_bp = 500
max_amu_bp = 100
# When true, drop ticks whose call or put leg is stale (carried-forward, non-updated)
# before any AMU/MMA aggregation. Default false: no stale filtering.
filter_stale = false

[pcp]
# Round-trip arbitrage cost for one notional, netted into MMA (and hence MU). Three
# commensurate terms, all per one notional (no contract multiplier):
#   cost = cost_per_notional * index  +  cost_per_option_value * (call+put mid)  +  flat_dollar_amount
# Only MMA and MU (U_c, U_u) depend on this; the descriptive liquidity channels do not.
cost_per_notional = 0.003
# Fraction of the option capital (sum of call+put mid prices) charged per cycle.
cost_per_option_value = 0.0
# Flat dollar cost for one full arbitrage cycle of one notional.
flat_dollar_amount = 0.0
#cost_per_notional = 0.0005
# AMU cost grid as fractions of notional (same units as cost_per_notional), given as
# [start, end, step] with end inclusive. The panel precomputes conditional/
# unconditional AMU at each grid cost. These are ABSOLUTE costs, independent of
# cost_per_notional: an entry of 0.0020 always means AMU at exactly 20 bp of the
# gross wedge, whatever cost_per_notional is set to.
cost_grid = [0.0005, 0.005, 0.0005]
fut_mgn_rate = 0.2
short_put_mgn_rate = 0.5
short_call_mgn_rate = 0.5
r = 0.05
# Contract multiplier (coin units per exchange contract). Default applies to any
# exchange/underlying not overridden below; used only to convert quote/trade SIZES from
# contracts to coin (depth, volume, Amihud, the min-quote-size filter). Prices and
# bp/notional wedges are per coin and unaffected. Deribit = 1 contract = 1 coin.
contract_size = 1.0

# Per-(exchange:ref_sym) overrides of the contract multiplier (exchange contract specs).
# OKX options: 1 BTC contract = 0.01 BTC, 1 ETH contract = 0.1 ETH.
[pcp.contract_size_overrides]
"okex:BTCUSD" = 0.01
"okex:ETHUSD" = 0.1

[panel]
rel_strike_buckets = 21
tte_buckets = 10
tte_sqrt_min = 0.0
tte_sqrt_max = 1.0
mean_panel_columns = [
